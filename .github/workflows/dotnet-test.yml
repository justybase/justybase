name: dotnet-test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: JustyBase
    steps:
      - name: Checkout JustyBase
        uses: actions/checkout@v4
        with:
          path: JustyBase
      - name: Checkout ProDataGrid (sibling)
        uses: actions/checkout@v4
        with:
          repository: KrzysztofDusko/ProDataGrid
          ref: fix/recycled-row-cell-content
          path: ProDataGrid
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\JustyBase.slnx --force-evaluate
      - name: Build
        run: dotnet build .\JustyBase.slnx -c Debug --no-restore
      - name: Test with coverage
        run: >
          dotnet test .\source\JustyBase.Tests\JustyBase.Tests.csproj
          -c Debug --no-build
          --filter "Category!=Integration&Category!=Live"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-coverage
          path: JustyBase/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
      - name: Headless smoke tests
        env:
          RESPONSIVENESS_METRICS_PATH: ${{ github.workspace }}/JustyBase/TestResults/responsiveness-metrics.jsonl
        run: >
          dotnet test .\source\JustyBase.HeadlessTests\JustyBase.HeadlessTests.csproj
          -c Debug --no-build
          --filter "Category!=Integration&Category!=Live"
      - name: Upload responsiveness metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsiveness-metrics
          path: JustyBase/TestResults/responsiveness-metrics.jsonl
          if-no-files-found: warn
