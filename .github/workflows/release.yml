name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0-rc.1
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate and normalize version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION:-$REF_NAME}"
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=v$raw" >> "$GITHUB_OUTPUT"

  quality:
    name: Unit and headless tests
    needs: prepare
    uses: ./.github/workflows/dotnet-test.yml
    permissions:
      contents: read

  windows:
    name: Windows x64 self-contained ReadyToRun package
    needs: [prepare, quality]
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: JustyBase
    steps:
      - name: Checkout JustyBase
        uses: actions/checkout@v4
        with:
          path: JustyBase
      - name: Checkout Netezza libraries
        uses: actions/checkout@v4
        with:
          repository: justybase/JustyBase.NetezzaSql
          path: JustyBase.NetezzaSql
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\source\JustyBase\JustyBase.csproj --force-evaluate -p:UseLocalJustyBaseLibraries=true
      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows packages
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: .\scripts\package-windows.ps1 -Version $env:VERSION -OutputRoot .\artifacts -GitHubToken $env:GITHUB_TOKEN
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-self-contained
          path: |
            JustyBase/artifacts/*-self-contained.zip
            JustyBase/artifacts/*-self-contained-Setup.exe
          if-no-files-found: error

      - name: Upload Windows Velopack packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-velopack
          path: JustyBase/artifacts/velopack/*
          if-no-files-found: error

  linux:
    name: Linux x64 self-contained ReadyToRun package
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JustyBase
    steps:
      - name: Checkout JustyBase
        uses: actions/checkout@v4
        with:
          path: JustyBase
      - name: Checkout Netezza libraries
        uses: actions/checkout@v4
        with:
          repository: justybase/JustyBase.NetezzaSql
          path: JustyBase.NetezzaSql
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Restore
        run: dotnet restore ./source/JustyBase/JustyBase.csproj --force-evaluate -p:UseLocalJustyBaseLibraries=true
      - name: Build Linux package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash ./publishLinux.sh "$VERSION" ./artifacts
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-self-contained
          path: JustyBase/artifacts/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.rid }} self-contained package
    needs: [prepare, quality]
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64]
    defaults:
      run:
        working-directory: JustyBase
    steps:
      - name: Checkout JustyBase
        uses: actions/checkout@v4
        with:
          path: JustyBase
      - name: Checkout Netezza libraries
        uses: actions/checkout@v4
        with:
          repository: justybase/JustyBase.NetezzaSql
          path: JustyBase.NetezzaSql
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./source/JustyBase/JustyBase.csproj --force-evaluate -p:UseLocalJustyBaseLibraries=true
      - name: Build macOS self-contained package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash ./publishMacOS.sh "$VERSION" "${{ matrix.rid }}" ./artifacts
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: JustyBase/artifacts/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release and upload assets
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-windows-self-contained
          path: dist/windows
      - name: Download Windows Velopack packages
        uses: actions/download-artifact@v4
        with:
          name: release-windows-velopack
          path: dist/velopack
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: release-linux-self-contained
          path: dist/linux
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: release-osx-arm64
          path: dist/macos
      - name: Validate release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "JustyBase-${VERSION}-win-x64-self-contained-Setup.exe"
            "JustyBase-${VERSION}-win-x64-self-contained.zip"
            "JustyBase-${VERSION}-linux-x64-self-contained.zip"
            "JustyBase-${VERSION}-macos-arm64-self-contained.zip"
          )
          for file in "${expected[0]}" "${expected[1]}"; do
            test -s "dist/windows/$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done
          test -s "dist/linux/${expected[2]}" || { echo "Missing release asset: ${expected[2]}" >&2; exit 1; }
          test -s "dist/macos/${expected[3]}" || { echo "Missing release asset: ${expected[3]}" >&2; exit 1; }
          test -s dist/velopack/releases.win.json || { echo 'Missing Velopack release feed' >&2; exit 1; }
          test -s "dist/velopack/JustyBase-${VERSION}-full.nupkg" || { echo 'Missing Velopack full package' >&2; exit 1; }
          if find dist -type f \( -name '*.pdb' -o -name '*.dbg' -o -name '*.log' \) -print -quit | grep -q .; then
            echo 'Debug/log files found in release assets' >&2
            exit 1
          fi
          while IFS= read -r -d '' archive; do
            unzip -tqq "$archive"
            if unzip -Z1 "$archive" | grep -Eiq '(^|/)[^/]+\.(pdb|dbg|log)$'; then
              echo "Debug/log file found inside $archive" >&2
              exit 1
            fi
          done < <(find dist -type f -name '*.zip' -print0)
      - name: Setup .NET for Velopack upload
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install --global vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Create or update prerelease with Velopack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "JustyBase $VERSION" \
              --notes-file source/JustyBase/ReleaseNotes.md \
              --prerelease
          fi
          vpk upload github \
            --outputDir dist/velopack \
            --channel win \
            --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
            --token "$GH_TOKEN" \
            --tag "$TAG" \
            --releaseName "JustyBase $VERSION" \
            --pre --merge --publish
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "JustyBase $VERSION" \
            --notes-file source/JustyBase/ReleaseNotes.md
          gh release upload "$TAG" \
            "dist/windows/JustyBase-${VERSION}-win-x64-self-contained-Setup.exe" \
            "dist/windows/JustyBase-${VERSION}-win-x64-self-contained.zip" \
            "dist/linux/JustyBase-${VERSION}-linux-x64-self-contained.zip" \
            "dist/macos/JustyBase-${VERSION}-macos-arm64-self-contained.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx 'releases.win.json' <<<"$assets"
          grep -Fx "JustyBase-${VERSION}-full.nupkg" <<<"$assets"
